services:
  - type: web
    name: forex-gold-alert-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python forex_gold_alert_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MARKETAUX_API_KEY
        sync: false
