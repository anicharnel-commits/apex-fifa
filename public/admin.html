<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - FIFA Predictions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="header-content">
                <div class="brand">⚙️ Admin - FIFA Predictions</div>
                <button id="logoutBtn" class="btn btn-sm btn-outline">Déconnexion</button>
            </div>
        </header>

        <main class="container">
            <div id="adminLogin" class="login-box">
                <h2>🔐 Accès Admin</h2>
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label>Clé secrète</label>
                        <input type="password" id="adminSecretInput" placeholder="Entrez la clé admin" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
                    <div id="adminLoginMessage" class="message"></div>
                </form>
            </div>

            <div id="adminPanel" style="display:none;">
                <!-- Générer un code -->
                <section class="admin-section">
                    <h2>🔑 Générer un code d'abonnement</h2>
                    <form id="generateCodeForm" class="form-row">
                        <div class="form-group">
                            <label>Plan</label>
                            <select id="planSelect">
                                <option value="STARTER_5000">Starter (7 matchs/jour)</option>
                                <option value="PREMIUM_7000">Premium (15 matchs/jour)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Durée (jours)</label>
                            <input type="number" id="durationDays" value="7" min="1" max="365">
                        </div>
                        <button type="submit" class="btn btn-primary">✨ Générer</button>
                    </form>
                    <div id="generatedCodeDisplay" style="display:none; margin-top:12px; padding:12px; background:#1e293b; border-radius:8px;">
                        <p><strong>Code :</strong> <span id="newCode" style="color:#f59e0b; font-weight:700;"></span></p>
                        <p><strong>Plan :</strong> <span id="newCodePlan"></span></p>
                        <button id="copyCodeBtn" class="btn btn-sm btn-outline">📋 Copier</button>
                    </div>
                </section>

                <!-- Codes existants -->
                <section class="admin-section">
                    <h2>📋 Codes</h2>
                    <div id="codesContainer"><div class="loading">⏳ Chargement...</div></div>
                </section>

                <!-- Utilisateurs -->
                <section class="admin-section">
                    <h2>👥 Utilisateurs</h2>
                    <div id="usersContainer"><div class="loading">⏳ Chargement...</div></div>
                </section>

                <!-- Synchronisation -->
                <section class="admin-section">
                    <h2>🔄 Synchronisation</h2>
                    <button id="syncBtn" class="btn btn-gold">⟳ Forcer la synchronisation</button>
                    <div id="syncMessage" class="message"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
