<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA Predictions Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Login -->
        <div id="loginScreen" class="screen active">
            <div class="container">
                <div class="login-box">
                    <div class="logo">⚽ FIFA Predictions</div>
                    <p class="subtitle">Prédictions FIFA e-sport • 2 à 15 matchs par jour</p>
                    <form id="loginForm">
                        <div class="form-group">
                            <label>ID Utilisateur</label>
                            <input type="text" id="userIdInput" placeholder="Entrez votre identifiant" required>
                        </div>
                        <div class="form-group">
                            <label>Code d'activation</label>
                            <input type="text" id="codeInput" placeholder="FIFA-VIP-XXXX-XXXX-XXXX" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">🔑 Activer / Se connecter</button>
                        <div id="loginMessage" class="message"></div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboardScreen" class="screen">
            <header>
                <div class="header-content">
                    <div class="brand">⚽ FIFA Predictions</div>
                    <div class="user-info">
                        <span id="userStatus">👤 Chargement...</span>
                        <span id="planBadge" class="plan-badge">--</span>
                        <span id="daysRemaining" class="days-badge">-- jours</span>
                        <button id="logoutBtn" class="btn btn-sm btn-outline">Déconnexion</button>
                    </div>
                </div>
            </header>

            <main class="container">
                <!-- Statut abonnement -->
                <div class="subscription-status" id="subscriptionStatus">
                    <span class="status-badge" id="statusBadge">🔄 Vérification...</span>
                    <span id="quotaInfo">-- matchs aujourd'hui</span>
                </div>

                <!-- Prédictions du jour -->
                <section class="predictions-section">
                    <div class="section-header">
                        <h2>📊 Pronostics du jour</h2>
                        <span class="match-count" id="matchCount">0 matchs</span>
                    </div>
                    <div id="predictionsContainer">
                        <div class="loading">⏳ Chargement des pronostics...</div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
